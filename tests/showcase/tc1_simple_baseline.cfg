// ==============================================================================
// TC1: Simple / Baseline Configuration (Web Application Service)
// Course: Principles of Compiler Design (4CS501CC25) - Nirma University
// Concepts: Primitive Types (int, float, string, bool), Comments, and Blocks
// ==============================================================================

// Application metadata
app_name : string = "AuthService";
version : string = "1.0.0";
environment : string = "production";

// Primary server listener
server {
    host : string = "0.0.0.0";
    port : int = 8000 + 80;               // Evaluated via TAC addition to 8080
    workers : int = 4;
    enable_ssl : bool = true;
    keep_alive_timeout : float = 65.5;
}

// Background metrics configuration
monitoring {
    enabled : bool = true;
    sample_rate : float = 0.75;
    alert_threshold_sec : int = 30;
}
