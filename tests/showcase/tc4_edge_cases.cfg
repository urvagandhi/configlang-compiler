/* ==============================================================================
   Block comment at root level spanning multiple lines to verify scanner
   token discarding and correct line numbering.
   ============================================================================== */

// 1. Type Widening: Int literal assigned to float variable
widened_float : float = 42;

// 2. Arithmetic Edge Case: Zero in numerator is completely valid
zero_numerator : int = 0 / 100;

// 3. Unary minus applied to single number and expressions
negative_int : int = -25 + 10;
negative_expr : int = -(100 - 80);

// 4. Precedence with negative float and multiplication
float_calc : float = -12.5 + 2.5 * 4.0;

// 5. Grammar Edge Case: Empty block with zero statements inside
empty_section {
    // Empty statement list should parse without syntax error
}

// 6. Lexer Edge Case: Escaped quotes, tabs, newlines, and backslashes
strings_and_escapes {
    raw_path : string = "C:\\app\\configs\\sys.conf";
    multiline_text : string = "First line\nSecond line\t(tabbed)";
    quote_in_str : string = "He said \"ConfigLang\" is fast";
}
