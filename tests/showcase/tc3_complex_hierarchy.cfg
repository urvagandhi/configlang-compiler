// ==============================================================================
// TC3: Complex / Enterprise Cloud Hierarchy & Multi-Hop Optimization
// Course: Principles of Compiler Design (4CS501CC25) - Nirma University
// Concepts: Deep 3-Level Nesting, Multi-Hop Dependency Chains, Float Widening,
//           Operator Precedence (), *, /, +, - and Heavy Constant Folding
// ==============================================================================

cluster_id : string = "us-east-prod-01";
base_core_cost : float = 0.045;

cluster {
    region : string = "us-east-1";
    active : bool = true;

    // Level 2 Block: Node pool sizing and compute limits
    node_pool {
        node_count : int = 8;

        // Level 3 Block: Hardware specifications
        compute {
            cores_per_node : int = 16;
            ram_per_core_mb : int = 4096;

            // Multi-hop reference 1: compute total RAM per node
            total_node_ram_mb : int = @cluster.node_pool.compute.cores_per_node * @cluster.node_pool.compute.ram_per_core_mb;

            // Multi-hop reference 2: reserve 2GB for OS daemon overhead
            usable_ram_mb : int = @cluster.node_pool.compute.total_node_ram_mb - 2048;
        }

        // Multi-hop reference 3: cluster aggregate core capacity
        total_cluster_cores : int = @cluster.node_pool.node_count * @cluster.node_pool.compute.cores_per_node;

        // Mixed float and integer arithmetic expression with widening
        hourly_compute_cost : float = (@cluster.node_pool.total_cluster_cores * @base_core_cost) + 2.50;
    }

    // Level 2 Block: Containerized workload allocations
    workload {
        pod_memory_mb : int = 1024;

        // Parentheses override and division: (usable_ram / pod_ram) - buffer
        max_pods_per_node : int = (@cluster.node_pool.compute.usable_ram_mb / @cluster.workload.pod_memory_mb) - 2;

        // Multi-hop reference 4: total cluster pod density
        cluster_pod_capacity : int = @cluster.node_pool.node_count * @cluster.workload.max_pods_per_node;
    }
}
