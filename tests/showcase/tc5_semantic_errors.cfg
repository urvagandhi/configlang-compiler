// Concepts: Symbol Table Duplicate Detection, Type Narrowing Mismatch,
//           Primitive Type Mismatch, Undefined Symbol, and Circular Dependencies
// ==============================================================================

app_name : string = "Gateway";

// 1. Semantic Error: Type Narrowing Mismatch (30 * 100.00 yields float, assigned to int)
scale_factor : int = 30 * 100.00;

// 2. Semantic Error: Primitive Type Incompatibility (string literal assigned to int)
port : int = "eight-zero-eight-zero";

// 3. Semantic Error: Duplicate Declaration in the same scope
max_threads : int = 8;
max_threads : int = 16;

server {
    // 4. Semantic Error: Undefined Reference to non-existent symbol
    cache_url : string = "redis://" + @cache_cluster.primary_node;

    // 5. Semantic Error: Circular Reference (referencing itself)
    self_retry_limit : int = @server.self_retry_limit + 1;
}
