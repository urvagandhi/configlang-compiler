// ==============================================================================
// TC2: Medium / Feature-Rich (References, String Concat, Inferred Types)
// Course: Principles of Compiler Design (4CS501CC25) - Nirma University
// Concepts: Cross-Block References (@), String Concatenation (+), Type Inference
// ==============================================================================

// Inferred string types without explicit type annotations
service = "analytics-engine";
base_domain = "internal.net";

database {
    // String concatenation utilizing cross-block variable references
    host = "db-primary." + @base_domain;
    port : int = 5432;
    max_pool : int = 20;

    // Full connection URI assembled via compile-time string folding
    url = "postgresql://" + @database.host + ":" + "5432/analytics";
}

api {
    // Nested cross-scope reference resolution
    endpoint = "https://" + @service + "." + @base_domain;
    rate_limit : int = @database.max_pool * 50;
    timeout_ms : int = 5 * 1000;
}
