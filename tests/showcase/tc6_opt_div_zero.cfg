// ==============================================================================
// TC6: Optimizer Constant Propagation Error (Negative Test Case)
// Course: Principles of Compiler Design (4CS501CC25) - Nirma University
// Concepts: Dynamic Division by Zero caught in Phase 6 (Code Optimization).
//           Code passes Lexical, Syntax, Symbol Table, and Semantic checks,
//           but is caught when TAC propagates expressions to: 5000 / 0.
// ==============================================================================

cluster_name : string = "LoadBalancer";
total_capacity : int = 100;

gateway {
    reserved_units : int = 2 * 25;                         // Folds to 50
    static_units : int = 50;                               // Constant 50
    free_units : int = @total_capacity - (@gateway.reserved_units + @gateway.static_units); // Evaluates to: 100 - (50 + 50) = 0

    // Valid syntax, valid types, valid symbols, BUT zero divisor computed dynamically!
    traffic_per_free_unit : int = 5000 / @gateway.free_units;
}
